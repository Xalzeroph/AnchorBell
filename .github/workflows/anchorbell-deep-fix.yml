name: AnchorBell deep fix

on:
  push:
    branches:
      - diag-risk-20260908

permissions:
  contents: write

jobs:
  deep-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diag-risk-20260908
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply OOS independence and coverage repair
        run: python3 .github/scripts/anchorbell_oos_independence_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Architecture gate
        run: python3 scripts/architecture_gate.py

      - name: Resource gate
        run: python3 scripts/resource_gate.py

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy regression scan
        run: cargo clippy --workspace --all-targets --all-features

      - name: Commit validated repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/oos_validation.rs \
                  engine/src/simulation_batch.rs \
                  engine/src/bin/anchorbell_oos_select.rs
          git commit -m "fix: enforce OOS fold independence and coverage"
          git push origin HEAD:diag-risk-20260908
