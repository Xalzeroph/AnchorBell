name: AnchorBell strategy profile staging

on:
  push:
    branches:
      - strategy-profile-staging-20260908

permissions:
  contents: write

jobs:
  strategy-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout strategy-profile staging branch
        uses: actions/checkout@v4
        with:
          ref: strategy-profile-staging-20260908
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply strategy-profile convergence repair
        run: python3 .github/scripts/anchorbell_strategy_profile_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Validate example profile JSON
        run: python3 -m json.tool config/anchorbell-simulation.example.json >/dev/null

      - name: Architecture gate
        run: python3 scripts/architecture_gate.py

      - name: Resource gate
        run: python3 scripts/resource_gate.py

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy regression scan
        run: cargo clippy --workspace --all-targets --all-features

      - name: Commit validated profile convergence
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/simulation.rs \
                  engine/src/simulation_batch.rs \
                  engine/src/bin/anchorbell_simulation_batch.rs \
                  deploy/systemd/anchorbell-simulation.service
          git commit -m "feat: restore audited strategy-profile batch startup"
          git push origin HEAD:strategy-profile-staging-20260908
