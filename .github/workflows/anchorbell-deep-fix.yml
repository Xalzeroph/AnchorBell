name: AnchorBell deep fix

on:
  push:
    branches:
      - diag-risk-20260908

permissions:
  contents: write

jobs:
  deep-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diag-risk-20260908
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply M9 cumulative semantics repair
        run: python3 .github/scripts/anchorbell_m9_cumulative_semantics_fix.py

      - name: Extract risk metrics module
        run: python3 .github/scripts/anchorbell_risk_metrics_module_fix.py

      - name: Enforce causal walk-forward calibration
        run: python3 .github/scripts/anchorbell_walkforward_contract_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Architecture gate
        run: python3 scripts/architecture_gate.py

      - name: Resource gate
        run: python3 scripts/resource_gate.py

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy regression scan
        run: cargo clippy --workspace --all-targets --all-features

      - name: Commit validated repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/strategy/calibration.rs engine/src/simulation.rs engine/src/simulation/runtime.rs engine/src/simulation/risk_metrics.rs engine/src/bin/anchorbell_backtest.rs
          git commit -m "fix: enforce causal walk-forward calibration"
          git push origin HEAD:diag-risk-20260908
