name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anchorbell-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "unresolved merge markers found"
            exit 1
          fi
      - name: Check patch whitespace
        run: git diff --check
      - run: cargo fmt --all -- --check
      - name: Enforce architecture boundaries
        run: python3 scripts/architecture_gate.py
      - name: Enforce source resource budgets
        run: python3 scripts/resource_gate.py
      - name: Dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce production vocabulary boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = (
              "anchorbell_paper",
              "paper_lab",
              "research_methods",
              "validation_methods",
              "market_legacy_exports",
              "legacy_global",
              "尚未找到纸盘",
          )
          roots = (Path("engine/src"), Path("engine/web"), Path("docs"))
          failures = []
          for root in roots:
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in {".rs", ".md", ".toml", ".js", ".html", ".css"}:
                      text = path.read_text(encoding="utf-8", errors="ignore")
                      for term in forbidden:
                          if term in text:
                              failures.append(f"{path}: {term}")
          if failures:
              raise SystemExit("forbidden production vocabulary found:\n" + "\n".join(failures))
          print("production vocabulary boundary passed")
          PY
      - run: cargo test --workspace --locked
      - name: Release integration tests
        run: cargo test --workspace --release --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run -p anchorbell-engine --bin market_throughput_smoke --release --locked
      - name: Generate dependency SBOM input
        run: |
          mkdir -p target
          cargo metadata --locked --format-version 1 > target/anchorbell-sbom.json
      - name: Upload dependency SBOM input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anchorbell-sbom-${{ github.sha }}
          path: target/anchorbell-sbom.json
