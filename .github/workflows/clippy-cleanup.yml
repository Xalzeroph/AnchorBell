name: Clippy cleanup validation

on:
  push:
    branches:
      - clippy-cleanup-20260908

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clippy-cleanup-20260908
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 .github/scripts/clippy_cleanup.py
      - run: cargo fmt --all
      - run: python3 scripts/architecture_gate.py
      - run: python3 scripts/resource_gate.py
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/execution/credential_store.rs \
                  engine/src/network.rs \
                  engine/src/simulation/experiment_plan.rs \
                  engine/src/simulation/runtime.rs \
                  engine/src/validation_contracts.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: make strict clippy gate actionable"
          git push origin HEAD:clippy-cleanup-20260908
